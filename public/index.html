<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>htzone | חיפוש מוצרים (תרגיל בית)</title>
  <meta name="description" content="חיפוש בקטלוג המוצרים בעברית ובאנגלית, לפי שם או לפי מה שאתם צריכים">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" dir="ltr" aria-label="htzone, חזרה לדף הבית">htzone<span class="logo-dot" aria-hidden="true"></span></a>
    <span class="tag">תרגיל בית, לא האתר הרשמי</span>
  </header>

  <main>
    <section class="hero">
      <h1>מה בא לכם למצוא?</h1>
      <p class="lede">כתבו שם של מוצר, או פשוט תארו מה אתם צריכים</p>

      <form class="search" role="search" id="search-form">
        <label for="q" class="visually-hidden">חיפוש מוצרים</label>
        <input id="q" name="q" type="search" dir="auto" autocomplete="off" maxlength="200"
               placeholder="למשל: מתנה למישהו שאוהב לבשל">
        <button type="button" class="clear" id="clear" aria-label="ניקוי החיפוש" hidden>×</button>
        <button type="submit" class="submit" aria-label="חיפוש">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <span>חיפוש</span>
        </button>
      </form>

      <div class="examples" id="examples">
        <span class="examples-label">אפשר לנסות:</span>
        <button type="button" class="chip">שואב אבק</button>
        <button type="button" class="chip">iPhone 16</button>
        <button type="button" class="chip">מתנה למישהו שאוהב לבשל</button>
        <button type="button" class="chip">משהו שיעזור לנקות שערות של כלב מהספה</button>
      </div>
    </section>

    <section class="results" aria-labelledby="results-title">
      <h2 id="results-title" class="results-title" aria-live="polite"></h2>
      <div id="status"></div>
      <ul class="grid" id="grid"></ul>
    </section>
  </main>

  <template id="card-template">
    <li class="card">
      <div class="card-media"><img alt="" loading="lazy" decoding="async" width="600" height="600"></div>
      <div class="card-body">
        <h3 class="card-name"><bdi></bdi></h3>
        <p class="card-meta"><bdi class="card-brand"></bdi><span class="card-sub"></span></p>
      </div>
    </li>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
